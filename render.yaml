# Blueprint Render (https://render.com/docs/blueprint-spec) : le service web
# Node seulement. La base PostgreSQL est chez Supabase depuis le 18/09/2026
# (demande du pharmacien responsable) : elle n'est pas décrite ici, sa chaîne
# de connexion se pose à la main dans le tableau de bord (DATABASE_URL,
# sync: false), et le service la joint en IPv4 par le pooler de session de
# Supabase — docs/DEPLOIEMENT.md, « Supabase (base) ».
#
# Hébergeur du service retenu le 18/09/2026 (question 8, choix a). Le statut
# opposable du dispositif (question 7, choix b) écarte le plan gratuit : mise
# en veille du service après inactivité. Le plan ci-dessous est le plus petit
# plan payant connu au 18/09/2026 ; la documentation de Render n'était pas
# joignable depuis l'environnement de travail : [à vérifier] l'identifiant de
# plan sur render.com/docs/blueprint-spec et render.com/pricing au moment du
# déploiement. Un identifiant inconnu est refusé par Render à « Apply »,
# jamais remplacé en silence.
#
# Le service en ligne (https://pharmatechx.onrender.com) a été créé à la main
# le 18/09/2026, hors blueprint : ce fichier décrit la configuration cible
# (plan, région, variables, contrôle de santé) à vérifier dans le tableau de
# bord, et permet de recréer le service. [à vérifier] avant « Apply » sur un
# compte qui porte déjà le service : Render créerait un doublon ou refuserait
# le nom. AUTH_SECRET est généré par Render ; DATABASE_URL est demandée à
# l'application du blueprint ; le schéma est appliqué au premier accès à la
# base. Avant tout usage comme preuve : docs/DEPLOIEMENT.md, « Mise en
# service ».
services:
  - type: web
    name: pharmatechx
    runtime: node
    plan: starter               # [à vérifier] plus petit plan payant, sans mise en veille
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/sante
    autoDeployTrigger: commit
    # branch: production        # à décommenter et à poser dans le tableau de bord
                                # à la mise en service seulement (question 21, choix c) :
                                # jusque-là Render déploie la branche de travail et le
                                # site d'essai suit chaque poussée. [à vérifier] le nom
                                # exact de la clé sur render.com/docs/blueprint-spec.
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false               # chaîne « Session pooler » de Supabase (port 5432, IPv4), saisie dans le tableau de bord
      - key: DATABASE_SSL
        value: require            # base externe : TLS ; « verify » avec DATABASE_SSL_CA (certificat de Supabase [à vérifier])
      - key: DATABASE_IP
        value: "4"                # famille d'adresses imposée (défaut du code) : Render ne sort pas en IPv6 [à vérifier]
      - key: DATABASE_POOL_MAX
        value: "3"                # pooler de session : une connexion serveur par connexion du pool
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_INITIAL
        sync: false               # code du premier administrateur, au format XXXXX-XXXXX.
                                  # Aucun bouton public ne crée ce compte (19/09/2026) : la
                                  # page de connexion est ouverte à tous, un tel bouton y
                                  # offrait le rôle au premier venu tant que la base était
                                  # vide. Poser la variable, redéployer, entrer avec ce code,
                                  # créer ses propres codes, révoquer celui-ci, puis
                                  # SUPPRIMER la variable. Sans administrateur actif, elle
                                  # en recrée un au démarrage ; avec, elle est sans effet.
      - key: CONSERVATION_RAPPORTS
        value: pseudonyme         # 19/09/2026, vu avec le DPO : résultats conservés sous le seul
                                  # numéro d'anonymisation (AG-NNN), aucun nom en base ; le fichier
                                  # de rapprochement numéro ↔ personne est tenu hors du site
                                  # (question 28, choix a). « aucune » désactive rapports, visas et
                                  # identifiants d'agents — voir docs/RGPD.md.
      - key: PROCEDURE_HABILITATION
        value: ""                 # référence de la procédure interne — [à compléter]
      - key: MISE_EN_SERVICE
        value: ""                 # AAAA-MM-JJ à la mise en service ; vide = phase d'essai
      - key: BASE_ATTENDUE
        value: ""                 # « service » à la mise en service (question 23, choix b) :
                                  # la base s'étiquette au premier accès et n'est plus servie
                                  # qu'à un environnement qui la réclame. Vide pendant l'essai.
