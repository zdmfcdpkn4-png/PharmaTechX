# Blueprint Render (https://render.com/docs/blueprint-spec) : un service web
# Node et une base PostgreSQL managée, région Francfort.
#
# Hébergeur retenu le 18/09/2026 (question 8, choix a). Le statut opposable du
# dispositif (question 7, choix b) écarte les plans gratuits : mise en veille du
# service, base gratuite à durée limitée, aucune sauvegarde garantie. Les plans
# ci-dessous sont les plus petits plans payants connus au 18/09/2026 ; la
# documentation de Render n'était pas joignable depuis l'environnement de
# travail : [à vérifier] les identifiants de plan et leur contenu (sauvegardes,
# rétention, connexions) sur render.com/docs/blueprint-spec et render.com/pricing
# au moment du déploiement. Un identifiant inconnu est refusé par Render à
# « Apply », jamais remplacé en silence.
#
# Après « New → Blueprint » : AUTH_SECRET est généré par Render ; DATABASE_URL
# est branchée sur la base créée ici. Le schéma est appliqué au premier accès.
# Avant tout usage comme preuve : docs/DEPLOIEMENT.md, « Mise en service ».
services:
  - type: web
    name: formation-pharmacotechnie
    runtime: node
    plan: starter               # [à vérifier] plus petit plan payant, sans mise en veille
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/sante
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: formation-pharmacotechnie-db
          property: connectionString
      - key: DATABASE_SSL
        value: disable            # réseau interne Render ; « require » pour une base externe
      - key: DATABASE_POOL_MAX
        value: "3"                # petit plan de base : peu de connexions simultanées
      - key: AUTH_SECRET
        generateValue: true
      - key: CONSERVATION_RAPPORTS
        value: aucune             # « pseudonyme » après validation RGPD — voir docs/RGPD.md
      - key: PROCEDURE_HABILITATION
        value: ""                 # référence de la procédure interne — [à compléter]

databases:
  - name: formation-pharmacotechnie-db
    plan: basic-256mb           # [à vérifier] plus petit plan payant, avec sauvegardes
    region: frankfurt
    databaseName: formation
    user: formation
